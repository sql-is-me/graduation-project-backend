# Tomcat
server:
  port: 9900

# Spring
spring:
  application:
    name: file-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  config:
    import:
      - nacos:file-service-dev.yml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

---
# Windows 开发环境
spring:
  config:
    activate:
      on-profile: dev

referer:
  enabled: false
  allowed-domains: http://127.0.0.1,http://localhost

file:
  domain: http://127.0.0.1:9900
  path: ./assets/files
  avatar-path: ./assets/pics/avatars
  sign-path: ./assets/pics/signs
  tp-path: ./assets/tps
  tm-path: ./assets/tms
  child-photo-path: ./assets/pics/photos/children
  coach-photo-path: ./assets/pics/photos/coaches

---
# Docker/Linux 部署环境
spring:
  config:
    activate:
      on-profile: prod

file:
  domain: http://file-service:9900
  path: /app/files
  avatar-path: /app/pics/avatars
  sign-path: /app/pics/signs
  tp-path: /app/tps
  tm-path: /app/tms
  child-photo-path: /app/pics/photos/children
  coach-photo-path: /app/pics/photos/coaches
